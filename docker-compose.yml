services:
  app:
    build:
      context: .
      target: dev
    stdin_open: true
    tty: true
    env_file:
      - .env
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      - db

  db:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=starter_db
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
